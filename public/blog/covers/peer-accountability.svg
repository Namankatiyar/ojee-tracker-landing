  <!-- Bottom Branding -->
  <g transform="translate(80, 615)">
    <text x="0" y="0" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">OJEE-TRACKER // FRIENDS ACCOUNTABILITY &amp; SPRINT NETWORK</text>
    <text x="1040" y="0" text-anchor="end" fill="#f472b6" font-family="monospace" font-size="11" font-weight="700">HTTPS://TRACKER.OJEET.TECH</text>
