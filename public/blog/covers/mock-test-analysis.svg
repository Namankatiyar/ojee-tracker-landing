<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgMocks" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#040814"/>
      <stop offset="60%" stopColor="#0a1226"/>
      <stop offset="100%" stopColor="#02040a"/>
    </linearGradient>
    <linearGradient id="scoreLineGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stopColor="#10b981" stopOpacity="0"/>
      <stop offset="100%" stopColor="#10b981" stopOpacity="0.25"/>
    </linearGradient>
    <pattern id="gridMocks" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgMocks)"/>
  <rect width="1200" height="675" fill="url(#gridMocks)"/>

  <!-- Top Tag -->
  <rect x="80" y="70" width="220" height="32" rx="16" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" strokeWidth="1"/>
  <circle cx="100" cy="86" r="4" fill="#10b981"/>
  <text x="114" y="91" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">TEST SERIES DIAGNOSTICS</text>

  <!-- Title -->
  <text x="80" y="180" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">The 150-to-220 Score Jump</text>
  <text x="80" y="230" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="20" font-weight="400">Scientific Mock Test Analysis &amp; Error Ledger for JEE &amp; NEET</text>

  <!-- Dashboard Widgets Container -->
  <g transform="translate(80, 270)">
    <!-- Big Score Progression Card -->
    <rect width="640" height="280" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>
    <text x="24" y="36" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Mock Score Progression (Trajectory)</text>
    <text x="24" y="54" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">TARGET: 220+ / 300 (TOP 1% PERCENTILE)</text>

    <!-- Chart Axes & Points -->
    <line x1="50" y1="230" x2="590" y2="230" stroke="rgba(255,255,255,0.1)" strokeWidth="1"/>
    <line x1="50" y1="160" x2="590" y2="160" stroke="rgba(255,255,255,0.05)" strokeWidth="1" strokeDasharray="3 3"/>
    <line x1="50" y1="90" x2="590" y2="90" stroke="rgba(255,255,255,0.05)" strokeWidth="1" strokeDasharray="3 3"/>

    <path d="M 70 205 L 170 185 L 270 190 L 370 145 L 470 115 L 570 82" fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round"/>
    <path d="M 70 205 L 170 185 L 270 190 L 370 145 L 470 115 L 570 82 L 570 230 L 70 230 Z" fill="url(#scoreLineGrad)"/>

    <circle cx="70" cy="205" r="5" fill="#10b981"/>
    <text x="70" y="222" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">142</text>
    <circle cx="170" cy="185" r="5" fill="#10b981"/>
    <circle cx="270" cy="190" r="5" fill="#10b981"/>
    <circle cx="370" cy="145" r="5" fill="#10b981"/>
    <circle cx="470" cy="115" r="5" fill="#10b981"/>
    <circle cx="570" cy="82" r="7" fill="#007fff" stroke="#ffffff" strokeWidth="2"/>
    <text x="570" y="70" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="13" font-weight="700">224</text>
    <text x="570" y="248" text-anchor="middle" fill="#007fff" font-family="monospace" font-size="11" font-weight="700">MOCK 14 (LATEST)</text>

    <!-- Side Metrics Cards -->
    <g transform="translate(670, 0)">
      <rect width="370" height="85" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>
      <text x="20" y="32" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ERROR CATEGORY 1</text>
      <text x="20" y="58" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Silly Mistakes (-16 marks)</text>
      <text x="20" y="74" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10">Sign errors, misreading units, bubbling</text>

      <g transform="translate(0, 97)">
        <rect width="370" height="85" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>
        <text x="20" y="32" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ERROR CATEGORY 2</text>
        <text x="20" y="58" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Conceptual Gaps (-24 marks)</text>
        <text x="20" y="74" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10">Formulas known, mechanism not mastered</text>
      </g>

      <g transform="translate(0, 194)">
        <rect width="370" height="85" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>
        <text x="20" y="32" fill="rgba(255,255,255,0.5)" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ERROR CATEGORY 3</text>
        <text x="20" y="58" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Time Panics (-12 marks)</text>
        <text x="20" y="74" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="10">Spent 12 mins stuck on a single Maths PYQ</text>
      </g>
    </g>
  </g>

  <!-- Bottom Branding -->
  <g transform="translate(80, 615)">
    <text x="0" y="0" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">OJEE-TRACKER // MOCK TEST LEDGER (300 &amp; 720 MARKS)</text>
    <text x="1040" y="0" text-anchor="end" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">HTTPS://TRACKER.OJEET.TECH</text>
  </g>
</svg>
