<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgPomo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#080314"/>
      <stop offset="60%" stopColor="#140728"/>
      <stop offset="100%" stopColor="#05020c"/>
    </linearGradient>
    <pattern id="gridPomo" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgPomo)"/>
  <rect width="1200" height="675" fill="url(#gridPomo)"/>

  <!-- Top Tag -->
  <rect x="80" y="70" width="200" height="32" rx="16" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.4)" strokeWidth="1"/>
  <circle cx="100" cy="86" r="4" fill="#a855f7"/>
  <text x="114" y="91" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DEEP WORK ENGINE</text>

  <!-- Title -->
  <text x="80" y="180" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">The 10-Hour Deep Work Blueprint</text>
  <text x="80" y="230" fill="rgba(255,255,255,0.6)" font-family="-apple-system, sans-serif" font-size="20" font-weight="400">Pomodoro Intervals &amp; Subject Hour Analytics for JEE &amp; NEET</text>

  <!-- Visual Display -->
  <g transform="translate(80, 270)">
    <!-- Dial / Timer Card -->
    <rect width="480" height="280" rx="12" fill="rgba(24,12,46,0.7)" stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>
    
    <!-- Circular Gauge -->
    <circle cx="240" cy="130" r="85" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="8"/>
    <circle cx="240" cy="130" r="85" fill="none" stroke="#a855f7" strokeWidth="8" strokeDasharray="534" strokeDashoffset="133" strokeLinecap="round" transform="rotate(-90 240 130)"/>

    <text x="240" y="142" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="44" font-weight="800">25:00</text>
    <text x="240" y="165" text-anchor="middle" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2">FOCUS INTERVAL ACTIVE</text>
    
    <g transform="translate(100, 230)">
      <rect x="0" y="0" width="85" height="26" rx="4" fill="rgba(99,102,241,0.2)" stroke="#6366f1" strokeWidth="1"/>
      <text x="42" y="17" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="10" font-weight="700">PHYSICS</text>

      <rect x="95" y="0" width="85" height="26" rx="4" fill="rgba(16,185,129,0.2)" stroke="#10b981" strokeWidth="1"/>
      <text x="137" y="17" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">CHEMISTRY</text>

      <rect x="190" y="0" width="85" height="26" rx="4" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" strokeWidth="1"/>
      <text x="232" y="17" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="700">MATHS</text>
    </g>

    <!-- Side Analytics Stats -->
    <g transform="translate(510, 0)">
      <rect width="530" height="280" rx="12" fill="rgba(24,12,46,0.7)" stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>
      <text x="30" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Weekly Deep Work Analytics (62.4 Hours Total)</text>
      
      <!-- Day Bars -->
      <g transform="translate(30, 80)">
        <text x="0" y="18" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">Mon</text>
        <rect x="40" y="6" width="320" height="14" rx="3" fill="#6366f1"/>
        <text x="375" y="18" fill="#ffffff" font-family="monospace" font-size="11">8.5h</text>

        <text x="0" y="46" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">Tue</text>
        <rect x="40" y="34" width="360" height="14" rx="3" fill="#6366f1"/>
        <text x="415" y="46" fill="#ffffff" font-family="monospace" font-size="11">9.2h</text>

        <text x="0" y="74" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">Thu</text>
        <rect x="40" y="62" width="300" height="14" rx="3" fill="#10b981"/>
        <text x="355" y="74" fill="#ffffff" font-family="monospace" font-size="11">7.8h</text>

        <text x="0" y="102" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">Fri</text>
        <rect x="40" y="90" width="410" height="14" rx="3" fill="#a855f7"/>
        <text x="465" y="102" fill="#ffffff" font-family="monospace" font-size="11">10.5h</text>

        <text x="0" y="130" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">Sat</text>
        <rect x="40" y="118" width="460" height="14" rx="3" fill="#007fff"/>
        <text x="465" y="130" fill="#00d2ff" font-family="monospace" font-size="11" font-weight="700">12.0h</text>
      </g>

      <text x="30" y="250" fill="rgba(255,255,255,0.4)" font-family="-apple-system, sans-serif" font-size="11">Active session logs automatically synced to offline IndexedDB local storage.</text>
    </g>
  </g>

  <!-- Bottom Branding -->
  <g transform="translate(80, 615)">
    <text x="0" y="0" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">OJEE-TRACKER // STUDY CLOCK &amp; POMODORO ENGINE</text>
    <text x="1040" y="0" text-anchor="end" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700">HTTPS://TRACKER.OJEET.TECH</text>
  </g>
</svg>
