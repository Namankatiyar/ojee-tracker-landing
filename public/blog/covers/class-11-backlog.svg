<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgBacklog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#0a050f"/>
      <stop offset="50%" stopColor="#1a0a2a"/>
      <stop offset="100%" stopColor="#050208"/>
    </linearGradient>
    <pattern id="gridBacklog" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bgBacklog)"/>
