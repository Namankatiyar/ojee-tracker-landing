        <text x="400" y="77" text-anchor="end" fill="#00d2ff" font-family="monospace" font-size="11">UNLOCKED</text>

        <rect x="0" y="104" width="412" height="42" rx="6" fill="rgba(0,127,255,0.06)" stroke="rgba(0,127,255,0.2)" strokeWidth="1"/>
        <text x="20" y="129" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Differential &amp; Integral Calculus</text>
        <text x="400" y="129" text-anchor="end" fill="#00d2ff" font-family="monospace" font-size="11">UNLOCKED</text>

