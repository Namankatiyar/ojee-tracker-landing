      <circle cx="20" cy="73" r="5" fill="#10b981"/>
      <text x="36" y="77" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Vectors, Kinematics &amp; Work-Energy</text>
      <text x="400" y="77" text-anchor="end" fill="#10b981" font-family="monospace" font-size="11">✓ CRITICAL</text>

