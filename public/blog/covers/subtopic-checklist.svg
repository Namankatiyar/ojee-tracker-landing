      <text x="237" y="19" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">✓ MODULES</text>
      <rect x="295" y="0" width="95" height="30" rx="15" fill="rgba(16,185,129,0.15)" stroke="#10b981" strokeWidth="1"/>
      <text x="342" y="19" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">✓ MOCKS</text>
