<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#05070f"/>
      <stop offset="50%" stopColor="#090d1a"/>
      <stop offset="100%" stopColor="#020307"/>
    </linearGradient>
    <linearGradient id="azureGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#007fff" stopOpacity="0.8"/>
      <stop offset="100%" stopColor="#00d2ff" stopOpacity="0.4"/>
